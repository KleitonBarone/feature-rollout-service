name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm artifacts:check
      - run: pnpm test:sdk-copy
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm test:integration
        if: runner.os == 'Linux'
      - run: pnpm test:e2e
        if: runner.os == 'Linux'
      - run: pnpm test:package
        if: runner.os == 'Windows'
  image:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: synthetic-ci-database-password
      ROLLOUT_CREDENTIALS: '[{"token":"synthetic-ci-management-token","actor":"ci","permission":"write","environments":["*"]}]'
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t feature-rollout:test .
      - run: |
          docker compose -f compose.release.yaml up -d --wait postgres
          docker compose -f compose.release.yaml run --rm service node dist/main.js migrate
          docker compose -f compose.release.yaml up -d --wait service
          curl --fail -H 'Authorization: Bearer synthetic-ci-management-token' -H 'Content-Type: application/json' -d '{"name":"restore-test"}' http://127.0.0.1:3100/v1/environments
          curl --fail -X PUT -H 'Authorization: Bearer synthetic-ci-management-token' -H 'Content-Type: application/json' -d '{"expectedRevision":0,"flag":{"key":"example","type":"boolean","defaultValue":false,"rules":[]}}' http://127.0.0.1:3100/v1/environments/restore-test/flags/example
          curl --fail -H 'Authorization: Bearer synthetic-ci-management-token' -H 'Content-Type: application/json' -d '{"expectedRevision":1,"expectedActiveVersion":0,"idempotencyKey":"initial"}' http://127.0.0.1:3100/v1/environments/restore-test/publish
          docker compose -f compose.release.yaml exec -T postgres pg_dump -U rollout -d rollout -Fc > /tmp/rollout.dump
          docker compose -f compose.release.yaml exec -T postgres psql -U rollout -d postgres -c 'CREATE DATABASE restored'
          docker compose -f compose.release.yaml exec -T postgres pg_restore -U rollout -d restored < /tmp/rollout.dump
          docker compose -f compose.release.yaml run --rm -e DATABASE_URL=postgresql://rollout:synthetic-ci-database-password@postgres:5432/restored service node dist/main.js migrate
          docker compose -f compose.release.yaml exec -T postgres psql -U rollout -d restored -c "SELECT actor FROM audit_events WHERE environment='restore-test'"
          docker compose -f compose.release.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U rollout -d restored <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM publications WHERE environment='restore-test') <> 1 THEN RAISE EXCEPTION 'Publication restore failed'; END IF;
            IF (SELECT count(*) FROM audit_events WHERE environment='restore-test') <> 3 THEN RAISE EXCEPTION 'Audit restore failed'; END IF;
          END $$;
          SQL
      - if: always()
        run: |
          docker compose -f compose.release.yaml logs
          docker compose -f compose.release.yaml down --volumes
