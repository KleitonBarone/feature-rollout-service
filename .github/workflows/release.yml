name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages and image after reviewing release candidates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm pack:release
      - run: docker build -t ghcr.io/kleitonbarone/feature-rollout-service:0.1.0 .
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: .local/artifacts/*.tgz
      - name: Publish approved packages
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish .local/artifacts/feature-rollout-evaluation-0.1.0.tgz --access public --provenance
          npm publish .local/artifacts/feature-rollout-sdk-node-0.1.0.tgz --access public --provenance
      - name: Publish approved image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/kleitonbarone/feature-rollout-service:0.1.0
