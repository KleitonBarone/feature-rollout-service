services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: rollout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: rollout
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rollout -d rollout"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
